# Datasource comes from the environment (SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD), see .env.example.
spring:
  application:
    name: mystix-backend
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
