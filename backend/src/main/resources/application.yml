# Datasource comes from the environment (SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD), see .env.example.
spring:
  application:
    name: mystix-backend
  flyway:
    locations: classpath:db/migration
  datasource:
    hikari:
      # Sized for the measured load (docs/pmo/plan-debit.md): saturation came from CPU at 8 to 16 concurrent calls,
      # so a pool larger than the cores only queues work in PostgreSQL. Override per deployment if needed.
      maximum-pool-size: ${MYSTIX_DB_POOL_SIZE:16}
      minimum-idle: 4
      connection-timeout: 5000
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

mystix:
  auth:
    # Every /api/v1 call needs a session token (ADR-0013). The dev profile and tests turn it off for API tooling.
    required: ${MYSTIX_AUTH_REQUIRED:true}
    max-failed-attempts: 5
    lock-duration: PT15M
    session-lifetime: PT12H
    idle-timeout: PT2H
  atelys:
    # Fictitious demonstration data endpoint (ADR-0014): developer profile only.
    demo-enabled: false
    # Issues beyond the BOM need plus this margin require a justification (percent).
    consumption-tolerance-percent: 10
  admin:
    # Cross-tenant operator endpoints (/api/v1/admin). Off by default; on in the dev profile only.
    # TODO(auth): operator role required once authentication exists (Lot 8).
    enabled: false
  connector:
    as2:
      # Public URL where partners send AS2 messages to Mystix, shown on the exchange sheet. Empty until the AS2
      # transport is deployed (Lot 6): the sheet then says the URL is to be confirmed.
      inbound-url: ${MYSTIX_AS2_INBOUND_URL:}
  queue:
    # Work queue in PostgreSQL (ADR-0003). One process or several: SKIP LOCKED and the per-lane lock keep them apart.
    worker-enabled: ${MYSTIX_QUEUE_WORKER_ENABLED:true}
    poll-interval: 500ms
    # Jobs run at the same time by this process (virtual threads).
    concurrency: 16
    # Jobs of one flow running at the same time across all nodes, unless queue_lane overrides it.
    default-max-running: 4
    max-attempts: 8
    lease: 5m
    backoff-base: 2s
    backoff-max: 15m
    # Unfinished jobs a flow may hold before new asynchronous work is refused with 429, unless queue_lane overrides it.
    default-max-queued: 10000
    retry-after: 30s
  clearance:
    # Only "simulated" exists (ADR-0001). Any other value stops the application at startup. TODO(DGI-SPEC)
    mode: ${MYSTIX_CLEARANCE_MODE:simulated}
    simulated:
      # Regex on the invoice number to simulate a rejection; empty = always cleared.
      reject-numbers-matching:
  invoice:
    # TODO(DGI-SPEC): rounding mode required by the DGI is not published.
    rounding-mode: HALF_UP
    ubl:
      # TODO(DGI-SPEC): replace with the Moroccan CIUS identifier once published (ADR-0005).
      customization-id: "urn:cen.eu:en16931:2017"
      # TODO(DGI-SPEC): no ISO 6523 scheme is known for the ICE; empty = no schemeID attribute.
      ice-scheme-id:
      # TODO(DGI-SPEC): TaxScheme ID carrying the Identifiant Fiscal (BT-32).
      tax-identifier-scheme-id: "TAX"

logging:
  # One line per event: timestamp with milliseconds and offset, level, request id, company, logger, message.
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS XXX} %-5level [%X{requestId:-}] [company=%X{companyId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS XXX} %-5level [%X{requestId:-}] [company=%X{companyId:-}] %logger{36} - %msg%n"
  file:
    # Local file, git-ignored. Rotated daily and at 10 MB, 14 days kept.
    name: ${MYSTIX_LOG_FILE:logs/mystix-backend.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
