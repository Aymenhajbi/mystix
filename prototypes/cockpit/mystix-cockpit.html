<title>Mystix Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F6F5F9; --surface:#FFFFFF; --surface-2:#F3F1F8; --surface-3:#E9E5F2;
  --line:#E3DFEC; --line-strong:#CEC8DB;
  --text:#16121E; --text-2:#433D51; --muted:#6D6680;
  --accent:#8500DE; --accent-soft:#F2E6FC; --accent-text:#FFFFFF; --logo:#8500DE;
  --ok:#1D8A58; --ok-soft:#E1F3EA;
  --warn:#B8650F; --warn-soft:#FBEEDD;
  --crit:#CC3338; --crit-soft:#FBE4E4;
  --info:#2A72C9; --info-soft:#E3EEFA;
  --code-bg:#FAF9FC; --c-tag:#7A12C9; --c-attr:#2A72C9; --c-str:#1D7A50; --c-com:#8C869A; --c-num:#B8650F;
  --shadow:0 12px 40px rgba(22,18,30,.16);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E0C13; --surface:#15121C; --surface-2:#1B1824; --surface-3:#25202F;
    --line:#2A2536; --line-strong:#3A3448;
    --text:#ECE9F2; --text-2:#BDB6CB; --muted:#8C859C;
    --accent:#B57BFF; --accent-soft:#2A1940; --accent-text:#120A1C; --logo:#FFFFFF;
    --ok:#43B883; --ok-soft:#14261F;
    --warn:#F0963F; --warn-soft:#2B2014;
    --crit:#F0595E; --crit-soft:#2E1719;
    --info:#6AA8F0; --info-soft:#16233A;
    --code-bg:#110E17; --c-tag:#C59BFF; --c-attr:#7DB3F2; --c-str:#72CFA0; --c-com:#6C6580; --c-num:#F2AE6B;
    --shadow:0 16px 48px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E0C13; --surface:#15121C; --surface-2:#1B1824; --surface-3:#25202F;
  --line:#2A2536; --line-strong:#3A3448;
  --text:#ECE9F2; --text-2:#BDB6CB; --muted:#8C859C;
  --accent:#B57BFF; --accent-soft:#2A1940; --accent-text:#120A1C; --logo:#FFFFFF;
  --ok:#43B883; --ok-soft:#14261F;
  --warn:#F0963F; --warn-soft:#2B2014;
  --crit:#F0595E; --crit-soft:#2E1719;
  --info:#6AA8F0; --info-soft:#16233A;
  --code-bg:#110E17; --c-tag:#C59BFF; --c-attr:#7DB3F2; --c-str:#72CFA0; --c-com:#6C6580; --c-num:#F2AE6B;
  --shadow:0 16px 48px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible,tr:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.t-crit{color:var(--crit)} .t-warn{color:var(--warn)} .t-ok{color:var(--ok)} .t-muted{color:var(--muted)} .t-info{color:var(--info)}

/* shell */
.shell{display:grid;grid-template-columns:64px 1fr;min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:16px;position:sticky;top:0;height:100vh}
.logo{width:38px;height:38px;border-radius:11px;background:#8500DE;display:grid;place-items:center;margin-bottom:14px;border:0;padding:0}
.logo svg{width:24px;height:24px}
.wordmark{height:22px;width:auto;display:block;color:var(--logo)}
.brand{display:flex;align-items:center;gap:14px}
.brand .sep{width:1px;height:22px;background:var(--line-strong)}
.rail button.nav{width:40px;height:40px;border-radius:10px;border:0;background:none;color:var(--muted);display:grid;place-items:center;position:relative}
.rail button.nav:hover{background:var(--surface-2);color:var(--text)}
.rail button.nav.on{background:var(--accent-soft);color:var(--accent)}
.tip{position:absolute;left:50px;background:var(--text);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:5}
.rail button:hover .tip{opacity:1}
.rail .sp{flex:1}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-size:12px;font-weight:600}
svg.i{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.main{padding-inline:28px;padding-block:18px 40px;min-width:0}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
.crumbs{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);width:100%;margin-bottom:-8px}
.crumbs button{border:0;background:none;padding:0;color:var(--accent)}
.crumbs button:hover{text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px;letter-spacing:.02em;white-space:nowrap}
.chip.env{background:var(--ok-soft);color:var(--ok)}
.chip.demo{background:var(--warn-soft);color:var(--warn)}
.chip.neutral{background:var(--surface-3);color:var(--text-2)}
.tenant{color:var(--muted);font-size:13px}
.search{flex:1;min-width:220px;max-width:520px;margin-inline:auto;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--muted);text-align:left}
.search:hover{border-color:var(--line-strong)}
.search span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-strong);border-radius:5px;padding:1px 6px;color:var(--muted);background:var(--surface-2)}
.live{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-2);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft);flex:none}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface-3);color:var(--text)}
select.sel{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px;color:var(--text)}

/* summary strip */
.strip{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:18px}
.strip > div{padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.strip > div + div{border-left:1px solid var(--line)}
.lbl{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.big{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.big small{font-size:14px;font-weight:500;color:var(--muted);margin-left:4px}
.sub{font-size:12.5px;color:var(--text-2)}
.sub b{font-weight:600}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-size:12.5px;font-weight:500;text-align:left}
.linkbtn:hover{text-decoration:underline}

.grid-a{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-bottom:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.panel + .panel{margin-top:18px}
.ph{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph h2{font-size:15px;font-weight:600;margin:0}
.ph .hint{font-size:12.5px;color:var(--muted)}
.ph .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.count{font-size:11.5px;font-weight:600;background:var(--surface-3);color:var(--text-2);border-radius:10px;padding:1px 7px}

/* journal */
.jbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 11px;font-size:12.5px;color:var(--text-2);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.filters button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.jsearch{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--muted);min-width:200px}
.jsearch input{border:0;background:none;outline:none;width:100%;font-size:13px;color:var(--text)}
.tablewrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:.03em;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.t td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;font-size:13px}
.t tbody tr:last-child td{border-bottom:0}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover td{background:var(--surface-2)}
.t .r{text-align:right;font-variant-numeric:tabular-nums}
.t td.wrap{white-space:normal;min-width:280px}
.t .time{font-family:var(--mono);font-size:12px;color:var(--text-2)}
.sevp{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:5px}
.sevp.err{background:var(--crit-soft);color:var(--crit)}
.sevp.warn{background:var(--warn-soft);color:var(--warn)}
.sevp.info{background:var(--info-soft);color:var(--info)}
.sevp.ok{background:var(--ok-soft);color:var(--ok)}
.clientlink{border:0;background:none;padding:0;color:var(--text);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.clientlink:hover{color:var(--accent);text-decoration:underline}
.stage{font-family:var(--mono);font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--text-2);white-space:nowrap}
.ev{font-size:13px}
.ev span{display:block;font-size:12px;color:var(--muted)}
.ref{font-family:var(--mono);font-size:12px;color:var(--accent)}
.go{color:var(--muted)}
tr.click:hover .go{color:var(--accent)}
.jfoot{padding:11px 18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line)}
.empty{padding:32px 18px;text-align:center;color:var(--muted)}

/* deadlines / pipeline */
.dl{list-style:none;margin:0;padding:6px 0}
.dl li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;padding:9px 18px;align-items:start}
.dl .when{font-family:var(--mono);font-size:12px;padding-top:1px}
.dl .what{font-size:13px}
.dl .what span{display:block;font-size:12px;color:var(--muted)}
.pipe{list-style:none;margin:0;padding:10px 18px 14px}
.pipe li{display:grid;grid-template-columns:118px minmax(0,1fr) 54px 42px;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.pipe .n,.pipe .d{font-family:var(--mono);font-size:12px;text-align:right;color:var(--text-2)}
.pipe li.stuck .name{color:var(--warn);font-weight:500}
.pipe li.stuck .bar i{background:var(--warn)}

.fname{font-weight:600}
.fname span{display:block;font-weight:400;font-size:12px;color:var(--muted);font-family:var(--mono)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;white-space:nowrap}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-ok{color:var(--ok)} .st-warn{color:var(--warn)} .st-err{color:var(--crit)} .st-run{color:var(--accent)}
.channel{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--text-2);margin-right:4px}
.target{font-size:11.5px;color:var(--muted)}

/* client environment */
.envhead{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.envid{display:flex;gap:14px;align-items:center}
.mono-av{width:44px;height:44px;border-radius:11px;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:16px;flex:none}
.envid h1{margin:0;font-size:22px;font-weight:600}
.envid p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.envtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.envtabs button{border:0;background:none;padding:10px 14px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:7px;align-items:center}
.envtabs button:hover{color:var(--text)}
.envtabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:500}

.split{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:18px;align-items:start}
.mlist{list-style:none;margin:0;padding:0;max-height:calc(100vh - 290px);overflow-y:auto}
.mlist li{border-bottom:1px solid var(--line)}
.mlist li:last-child{border-bottom:0}
.mitem{width:100%;border:0;background:none;text-align:left;padding:11px 16px;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:start}
.mitem:hover{background:var(--surface-2)}
.mitem.on{background:var(--accent-soft)}
.dir{font-family:var(--mono);font-size:10.5px;font-weight:600;border-radius:5px;padding:2px 0;text-align:center;margin-top:2px}
.dir.IN{background:var(--info-soft);color:var(--info)}
.dir.OUT{background:var(--accent-soft);color:var(--accent)}
.mitem.on .dir.OUT{background:var(--surface)}
.mt{font-weight:600;font-size:13.5px;display:block}
.ms{font-size:12px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mr{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.mr .time{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

.detail{display:flex;flex-direction:column;gap:18px;min-width:0}
.dhead{padding:16px 18px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.dhead h2{margin:0;font-family:var(--mono);font-size:20px;font-weight:500;letter-spacing:-.01em;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.meta{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2);margin-top:8px}
.meta .mono{font-size:12px;color:var(--muted)}
.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:8px 13px;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.confirm{display:none;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface-2);border-top:1px solid var(--line);padding:10px 18px;font-size:13px}
.confirm.show{display:flex}
.steps{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 16px}
.step{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 9px;border-radius:6px;background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.step::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.step.err{background:var(--crit-soft);color:var(--crit);font-weight:600}
.step.err::before{background:var(--crit)}
.step.warn{background:var(--warn-soft);color:var(--warn);font-weight:600}
.step.warn::before{background:var(--warn)}
.step.skip{color:var(--muted);background:none;border:1px dashed var(--line-strong)}
.step.skip::before{background:var(--line-strong)}

.diag{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0}
.diag > div{padding:14px 18px}
.diag > div + div{border-left:1px solid var(--line)}
.diag h4{margin:0 0 6px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center}
.diag p{margin:0 0 6px;font-size:13.5px;color:var(--text-2)}
.diag .code{font-family:var(--mono);font-size:12px}
.ai h4{color:var(--accent)}
pre.diff{font-family:var(--mono);font-size:12.5px;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0 10px;white-space:pre-wrap}
pre.diff .add{color:var(--ok)} pre.diff .del{color:var(--crit)}

.ftabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line);overflow-x:auto;align-items:flex-end}
.ftabs button{border:1px solid transparent;border-bottom:0;background:none;padding:7px 12px;font-size:12.5px;font-family:var(--mono);color:var(--muted);border-radius:8px 8px 0 0;white-space:nowrap;display:flex;gap:6px;align-items:center}
.ftabs button:hover{color:var(--text)}
.ftabs button.on{background:var(--code-bg);border-color:var(--line);color:var(--text);margin-bottom:-1px}
.ftabs button.na{opacity:.5}
.ftabs .edot{width:6px;height:6px;border-radius:50%;background:var(--crit)}
.ftabs .wdot{width:6px;height:6px;border-radius:50%;background:var(--warn)}
.fbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px;background:var(--code-bg);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.fbar .fn{font-family:var(--mono);color:var(--text-2)}
.fbar .right{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.viewer{background:var(--code-bg);font-family:var(--mono);font-size:12.5px;line-height:1.6;overflow:auto;max-height:520px;border-radius:0 0 14px 14px;padding-block:8px}
.ln{display:grid;grid-template-columns:46px minmax(0,1fr);white-space:pre;min-width:max-content}
.ln .no{color:var(--c-com);text-align:right;padding-right:14px;user-select:none;opacity:.8}
.ln.err{background:var(--crit-soft)}
.ln.err .no{color:var(--crit);opacity:1;font-weight:600}
.ln.warnl{background:var(--warn-soft)}
.lnmsg{display:grid;grid-template-columns:46px minmax(0,1fr);background:var(--crit-soft);color:var(--crit);font-family:var(--sans);font-size:12.5px;padding-bottom:6px;min-width:max-content}
.lnmsg.w{background:var(--warn-soft);color:var(--warn)}
.tg{color:var(--c-tag)} .at{color:var(--c-attr)} .st{color:var(--c-str)} .cm{color:var(--c-com);font-style:italic} .nm{color:var(--c-num)}
.na-box{padding:40px 18px;text-align:center;color:var(--muted);font-family:var(--sans);font-size:13.5px;white-space:normal}

/* palette & toast */
.scrim{position:fixed;inset:0;background:rgba(8,10,15,.45);opacity:0;pointer-events:none;transition:opacity .18s;z-index:30}
.scrim.open{opacity:1;pointer-events:auto}
.pal{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(640px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;box-shadow:var(--shadow);z-index:31;overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:15px 18px;font-size:15px;outline:none}
.pal ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow-y:auto}
.pal li{padding:9px 12px;border-radius:8px;display:flex;gap:10px;align-items:center;cursor:pointer;font-size:13.5px}
.pal li.act,.pal li:hover{background:var(--surface-2)}
.pal li .k{font-size:11px;color:var(--muted);width:78px;flex:none;text-transform:uppercase;letter-spacing:.05em}
.pal li .x{margin-left:auto;font-size:12px;color:var(--muted);font-family:var(--mono)}

.sthead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.sthead h1{margin:0;font-family:var(--mono);font-size:21px;font-weight:500;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sthead p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.chip.draft{background:var(--accent-soft);color:var(--accent)}
.stbar{display:flex;gap:0;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
.stbar > div{padding:10px 16px;display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);min-width:0}
.stbar > div + div{border-left:1px solid var(--line)}
.stbar b{font-size:14px;color:var(--text);font-weight:600}
.stbar .grow{flex:1}
.studio{display:grid;grid-template-columns:minmax(220px,250px) minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0;overflow:hidden}
.pane .ph{padding:11px 14px}
.pane .ph h2{font-size:13.5px}
.tree{font-family:var(--mono);font-size:12px;padding:6px 0;max-height:640px;overflow:auto}
.tree .sgm{padding:6px 14px 2px;color:var(--c-tag);font-weight:500}
.tree .fld{display:grid;grid-template-columns:10px minmax(0,auto) minmax(0,1fr);gap:8px;align-items:center;padding:3px 14px 3px 24px;border:0;background:none;width:100%;text-align:left;font-family:var(--mono);font-size:12px;cursor:pointer}
.tree .fld:hover{background:var(--surface-2)}
.tree .fld.sel{background:var(--accent-soft)}
.tree .fld .u{width:7px;height:7px;border-radius:50%;background:var(--line-strong)}
.tree .fld.used .u{background:var(--accent)}
.tree .fld .k{color:var(--text-2)}
.tree .fld .v{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.tree .fld.miss .v{color:var(--crit)}
.rules{width:100%;border-collapse:collapse;font-size:12.5px}
.rules th{text-align:left;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.rules td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.rules tr.grp td{background:var(--surface-2);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:5px 10px}
.rules tr.rule{cursor:pointer}
.rules tr.rule:hover td{background:var(--surface-2)}
.rules tr.rule.sel td{background:var(--accent-soft)}
.rules .tgt{font-family:var(--mono);font-size:12px;white-space:nowrap}
.rules .req{color:var(--crit);margin-left:3px}
.rules .src{font-family:var(--mono);font-size:11.5px;color:var(--text-2)}
.rules select{font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);max-width:170px}
.fmtchip{display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:5px;background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.tgl{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tgl input{accent-color:var(--accent)}
.mod{font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:1px 6px;border-radius:4px;background:var(--warn-soft);color:var(--warn);margin-left:6px}
tr.aisug td{background:var(--accent-soft)}
.aibox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--text-2)}
.aibox b{color:var(--accent)}
.fixtures{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}
.fx{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-family:var(--mono);font-size:11.5px;display:inline-flex;gap:7px;align-items:center}
.fx.on{border-color:var(--accent);background:var(--accent-soft)}
.fx .s{width:7px;height:7px;border-radius:50%}
.fx .s.pass{background:var(--ok)} .fx .s.fail{background:var(--crit)}
.xsd{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:5px}
.xsd.ok{background:var(--ok-soft);color:var(--ok)} .xsd.ko{background:var(--crit-soft);color:var(--crit)}
.ln.hit{background:var(--accent-soft)}

.diffbox .add{color:var(--ok)} .diffbox .del{color:var(--crit)} .diffbox .h{color:var(--muted)}
.inspector{padding:10px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--text-2);display:flex;flex-direction:column;gap:4px}
.inspector b{color:var(--text)}

}

/* ---------- coloration ---------- */
function hl(line, lang){
  let s = esc(line);
  if(lang==='xml'){
    s = s.replace(/(\s)([\w:.-]+)(=)("[^"]*")/g,'$1<span class="at">$2</span>$3<span class="st">$4</span>')
         .replace(/(&lt;!--.*?--&gt;)/g,'<span class="cm">$1</span>')
         .replace(/(&lt;\/?)([\w:.-]+)/g,'$1<span class="tg">$2</span>');
  } else if(lang==='json'){
    s = s.replace(/("[^"]*")(\s*:)/g,'<span class="at">$1</span>$2')
         .replace(/(:\s*)("[^"]*")/g,'$1<span class="st">$2</span>')
         .replace(/(:\s*)(-?\d+(?:\.\d+)?|null|true|false)/g,'$1<span class="nm">$2</span>');
  } else if(lang==='edi'){
    s = s.replace(/^([A-Z]{3})/,'<span class="tg">$1</span>').replace(/([+:'])/g,'<span class="cm">$1</span>');
  } else {
    s = s.replace(/^([\w-]+:)/,'<span class="at">$1</span>');
  }
  return s;
}

function go(view, opts={}){
  Object.assign(state, {view}, opts);

}

}

function spark(a, st){
  const w=110,h=24,max=Math.max(...a),min=Math.min(...a),rg=(max-min)||1;
  const pts=a.map((v,i)=>[i*(w-4)/(a.length-1)+2, h-3-(v-min)/rg*(h-8)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const col = st==='ok'?'var(--accent)':st==='warn'?'var(--warn)':'var(--crit)'; const l=pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true" style="display:block"><path d="${d} L${l[0]} ${h} L2 ${h}Z" fill="${col}" opacity=".12"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6"/><circle cx="${l[0]}" cy="${l[1]}" r="2.6" fill="${col}"/></svg>`;
}

function detailView(m){

      ${m.e.ai?`<div class="ai"><h4><svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>Suggestion IA · validation humaine requise</h4><pre class="diff">${m.e.ai.join('\n')}</pre><p>${esc(m.e.aiNote)}</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary sm" data-confirm="Rejouer à blanc avec cette correction, sans rien livrer ?|Rejeu à blanc lancé. Aucun document ne sera livré.">Rejeu à blanc</button><button class="btn sm" data-toast="Suggestion ignorée et consignée dans l'audit.">Ignorer</button></div></div>`
      :`<div><h4>Contexte</h4><p>Client : <b>${CLIENTS[m.c].name}</b></p><p>Partenaire : <b>${m.partner}</b></p><p>Mapping : <span class="code">${MAP[m.type]}</span></p>${m.e.tab2?'':'<p class="t-muted" style="margin:0">Aucune correction automatique proposée pour ce cas.</p>'}</div>`}
    </div></section>` : (m.note?`<section class="panel" style="padding:12px 18px;font-size:13px;color:var(--text-2)">${esc(m.note)}</section>`:'');
  return `<div class="detail">
    <section class="panel">
      <div class="dhead">
        <div style="min-width:0">
          <h2>${m.id} ${stChip}</h2>
          <div class="meta"><span>${TYPE[m.type]} <b>${m.ref}</b></span><span>${m.dir==='IN'?m.partner+' → '+CLIENTS[m.c].name:CLIENTS[m.c].name+' → '+m.partner}</span><span>${FMT[m.type][0]} → ${FMT[m.type][1]}</span>${m.amount?`<span><b>${fmt2(m.amount)} MAD</b></span>`:''}</div>
          <div class="meta"><span class="mono">corr. c-${m.id.slice(3,7).toLowerCase()}-0a7d</span><span class="mono">sha256 3f9a…${m.id.slice(-4).toLowerCase()}</span><span class="mono">${MAP[m.type]}</span><span class="mono">reçu 28/09 ${m.t}</span></div>

          ${m.type==='invoice'?'<button class="btn" data-go="studio">Ouvrir le mapping</button>':''}
          <button class="btn" data-confirm="Exécuter ${m.id} sans rien livrer et comparer la sortie ?|Rejeu à blanc lancé sur ${m.id}.">Rejeu à blanc</button>

      <div class="steps" aria-label="Étapes du traitement">${steps}</div>
      <div class="confirm" id="confirm"><span id="confirmTxt" style="flex:1;min-width:200px"></span><button class="btn sm" id="cNo">Annuler</button><button class="btn primary sm" id="cYes">Confirmer</button></div>

  </div>`;
}
function viewerBody(m,f){
  if(f.pending) return `<div class="na-box">${f.pending}</div>`;
  if(!f.body) return `<div class="na-box">${f.k==='out'&&m.type==='stock'?f.desc:`Non généré : le traitement s'est arrêté à l'étape « ${m.fail} ».`}</div>`;
  const lines = f.body.split('\n');
  const marks = {};
  if(m.e){
    const addMark=(tab,match,cls,msg)=>{ if(tab!==f.k||!match) return; let idx=lines.findIndex(l=>l.includes(match)); if(idx>=0) marks[idx]={cls,msg}; };
    addMark(m.e.tab,m.e.match,m.st==='err'?'err':'warnl',`${m.e.code} · ${m.e.title}`);
    addMark(m.e.tab2,m.e.match2,'warnl','Cause probable : code TVA MWSKZ absent sur ce poste');
    if(m.noBsart && f.k==='in'){ const i=lines.findIndex(l=>l.includes('<CURCY>')); if(i>=0) marks[i]={cls:'err',msg:'BSART attendu ici (INVO = facture, CRME = avoir)'}; }
  }
  return lines.map((l,i)=>{ const mk=marks[i]; return `<div class="ln ${mk?mk.cls:''}"><span class="no">${i+1}</span><span>${hl(l,f.lang)||' '}</span></div>${mk?`<div class="lnmsg ${mk.cls==='warnl'?'w':''}"><span></span><span>↳ ${esc(mk.msg)}</span></div>`:''}`; }).join('');
}

  document.querySelectorAll('.envtabs [data-tab]').forEach(b=>b.onclick=()=>go('client',{tab:b.dataset.tab}));

  const sf=$('#stF'); if(sf) sf.onclick=e=>{const b=e.target.closest('button'); if(b){state.stF=b.dataset.v; state.msg=null; state.file=null; render();}};

  const cn=$('#cNo'); if(cn) cn.onclick=()=>$('#confirm').classList.remove('show');
  const cp=$('#copyBtn'); if(cp) cp.onclick=()=>{ const m=byId(state.msg)||MSGS.find(x=>x.c===state.client); const f=files(m).find(x=>x.k===state.file);
    const fallback=()=>{ const r=document.createRange(); r.selectNodeContents($('#viewer')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('Texte sélectionné : Ctrl C pour copier.'); };
    try{ navigator.clipboard.writeText(f.body).then(()=>toast(`${f.name} copié.`),fallback); }catch(e){ fallback(); } };
  document.querySelectorAll('[data-mapping]').forEach(r=>r.onclick=()=>{
    const type = Object.keys(MAP).find(t=>MAP[t].startsWith(r.dataset.mapping)) || 'invoice';
    const m = MSGS.find(x=>x.type===type) ; const body=fileXsl(m);
    $('#mapview').innerHTML = `<section class="panel" style="margin-top:18px"><div class="fbar" style="border-radius:14px 14px 0 0"><span class="fn">${r.dataset.mapping}.xsl</span><span>Version publiée · lecture seule</span><span class="right"><button class="btn sm" data-toast="Ouverture dans Mapping Studio.">Ouvrir dans Mapping Studio</button></span></div><div class="viewer">${body.split('\n').map((l,i)=>`<div class="ln"><span class="no">${i+1}</span><span>${hl(l,'xml')||' '}</span></div>`).join('')}</div></section>`;
    $('#mapview').querySelectorAll('[data-toast]').forEach(b=>b.onclick=()=>go('studio'));
    $('#mapview').scrollIntoView({block:'start',behavior:'smooth'});
  });
}

function fixCalc(f){
  const lines = f.lines.map(l=>({...l, net:r2(l.MENGE*l.VPREI), taxed: !!(l.MWSKZ || ST2.ai==='ok')}));
  const ht = r2(lines.reduce((s,l)=>s+l.net,0));

function bindStudio(){
  const m=$('#main');
  m.querySelectorAll('[data-rule]').forEach(r=>r.onclick=e=>{ if(e.target.closest('input,select,label')) return; ST2.sel=r.dataset.rule; render(); });
  m.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{ const r=RULES.find(x=>x.keys&&x.keys.includes(b.dataset.key)); if(r){ST2.sel=r.id; render();} else toast('Champ non utilisé par ce mapping.'); });
  m.querySelectorAll('[data-cdata]').forEach(i=>i.onchange=()=>{ ST2.cdata[i.dataset.cdata]=i.checked; ST2.sel=i.dataset.cdata; render(); });
  const d=m.querySelector('[data-date]'); if(d) d.onchange=()=>{ ST2.dateFmt=d.value; ST2.sel='r2'; render(); };
  m.querySelectorAll('[data-ai]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); ST2.ai=b.dataset.ai; render(); toast(ST2.ai==='ok'?'Suggestion acceptée dans le brouillon v3.3. Elle sera tracée à la publication.':'Suggestion refusée et consignée dans l\'audit.'); });
  m.querySelectorAll('[data-fix]').forEach(b=>b.onclick=()=>{ ST2.fix=b.dataset.fix; render(); });
  const sp=$('#spane'); if(sp) sp.onclick=e=>{ const b=e.target.closest('button'); if(b){ ST2.pane=b.dataset.p; render(); } };
  m.querySelectorAll('[data-sact]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.sact, ch=studioChanges();
    const fails = Object.keys(FIX).filter(k=>{ const s=ST2.fix; ST2.fix=k; const ko=studioErrors(FIX[k]).length; ST2.fix=s; return ko; }).length;
    if(a==='diff'){ ST2.showDiff=!ST2.showDiff; render(); }
    if(a==='run') toast(fails?`Fixtures rejouées : ${24-fails}/24 conformes, ${fails} en échec.`:'Fixtures rejouées : 24/24 conformes.');
    if(a==='pub'){ if(!ch.length) toast('Aucune modification à publier.'); else if(fails) toast(`Publication bloquée : ${fails} fixture${fails>1?'s':''} en échec.`); else { ST2.confirm=true; render(); } }
    if(a==='cancel'){ ST2.confirm=false; render(); }
    if(a==='confirm'){ ST2.confirm=false; render(); toast('invoic02-ubl v3.3 publié. Retour à v3.2 possible depuis l\'historique.'); }
  });
}

  palView = palItems().filter(p=>!q||(p[0]+' '+p[1]).toLowerCase().includes(q)).slice(0,12);
  palIdx=Math.min(palIdx,Math.max(palView.length-1,0));
  $('#palList').innerHTML = palView.length?palView.map((p,i)=>`<li class="${i===palIdx?'act':''}" data-i="${i}"><span class="k">${p[0]}</span><span>${esc(p[1])}</span><span class="x">${p[2]}</span></li>`).join(''):`<li><span class="t-muted">Aucun résultat. Essayez un nom de client, un numéro de facture ou un ICE.</span></li>`;
}
function openPal(){ $('#pal').hidden=false; $('#palScrim').classList.add('open'); $('#palInput').value=''; palIdx=0; renderPal(); $('#palInput').focus(); }
function closePal(){ $('#pal').hidden=true; $('#palScrim').classList.remove('open'); }
function runPal(i){ const p=palView[i]; if(!p) return; closePal(); p[3](); }
$('#palScrim').onclick=closePal;
$('#palInput').addEventListener('input',()=>{palIdx=0;renderPal();});
$('#palInput').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){palIdx=Math.min(palIdx+1,palView.length-1);renderPal();e.preventDefault();}
  if(e.key==='ArrowUp'){palIdx=Math.max(palIdx-1,0);renderPal();e.preventDefault();}
  if(e.key==='Enter') runPal(palIdx);
});
$('#palList').addEventListener('click',e=>{const li=e.target.closest('li[data-i]'); if(li) runPal(+li.dataset.i);});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault(); $('#pal').hidden?openPal():closePal();}
  if(e.key==='Escape'&&!$('#pal').hidden) closePal();
});

let tt; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),3200); }
$('#themeBtn').onclick=()=>{ const r=document.documentElement; const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme=dark?'light':'dark'; };
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(h!==(state.view==='client'?state.client:state.view)) fromHash(); });
fromHash();
</script>
